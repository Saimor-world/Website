<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Saimôr</title>
  <desc id="desc">Green and gold Saimôr system sigil with circumflex and MÔRA satellite.</desc>
  <defs>
    <radialGradient id="field" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#21684c"/>
      <stop offset=".48" stop-color="#104833"/>
      <stop offset="1" stop-color="#05251b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset=".30" stop-color="#e9c763"/>
      <stop offset=".68" stop-color="#b9832f"/>
      <stop offset="1" stop-color="#f6dc88"/>
    </linearGradient>
    <radialGradient id="orb" cx="35%" cy="28%" r="74%">
      <stop offset="0" stop-color="#e5f6d7"/>
      <stop offset=".24" stop-color="#8ebf86"/>
      <stop offset=".68" stop-color="#3a6d54"/>
      <stop offset="1" stop-color="#173c2e"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="orbGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="124" cy="132" r="91" fill="url(#field)"/>
  <circle cx="124" cy="132" r="87" fill="none" stroke="url(#gold)" stroke-width="2.4" opacity=".95"/>
  <ellipse cx="124" cy="132" rx="108" ry="101" fill="none" stroke="url(#gold)" stroke-width="2.8" transform="rotate(-12 124 132)" opacity=".96"/>

  <path d="M151 66c-26 7-48 20-51 39-2 15 10 25 27 34 16 9 22 17 18 28-5 14-22 26-45 35 31-5 56-17 62-37 5-18-8-31-28-42-13-7-18-14-15-23 4-12 16-23 32-34z" fill="url(#gold)" filter="url(#soft)"/>

  <!-- Circumflex belongs to the sigil itself, not to a second letterform. -->
  <path d="M110 72 124 59l14 13" fill="none" stroke="url(#gold)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- MÔRA: deliberately off-centre, but visually locked to the orbital line. -->
  <path d="M188 52c8 2 16 5 23 9" fill="none" stroke="#d7b258" stroke-width="1.7" opacity=".72" stroke-linecap="round"/>
  <circle cx="211" cy="63" r="16.5" fill="url(#orb)" stroke="url(#gold)" stroke-width="2.7" filter="url(#orbGlow)"/>
  <circle cx="205.5" cy="57.5" r="3.7" fill="#f7efc8" opacity=".74"/>
</svg>