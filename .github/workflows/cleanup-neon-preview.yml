name: Cleanup Neon preview branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: neon-cleanup-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  delete-preview-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete matching Neon preview branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: blue-darkness-10877775
          branch: preview/${{ github.event.pull_request.head.ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
