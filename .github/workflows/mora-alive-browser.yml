name: MORA Alive Website browser checks
on:
  pull_request:
    paths:
      - 'components/mora/alive/**'
      - 'components/MoraAliveWebsite.tsx'
      - 'lib/use-site-lite-mode.ts'
      - 'lib/lite-mode-script.ts'
      - 'components/MoraHeroPresence*'
      - 'components/MoraCharacterBody*'
      - 'components/MoraDeepView*'
      - 'components/MoraFocusStone*'
      - 'components/MoraWaterGuide*'
      - 'components/MoraPerspective*'
      - 'components/MoraLanding*'
      - 'app/mora/page.tsx'
      - 'app/en/mora/page.tsx'
      - 'app/**/mora/alive/**'
      - 'app/mora/alive/**'
      - 'e2e/mora-alive.spec.ts'
      - 'e2e/mora-english-motion.spec.ts'
      - 'playwright.alive.config.ts'
      - '.github/workflows/mora-alive-browser.yml'
permissions:
  contents: read
concurrency:
  group: alive-website-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXTAUTH_SECRET: saimor-ephemeral-ci-only
      NEXTAUTH_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next build
      - run: npx playwright install --with-deps chromium webkit
      - name: Prepare existing trusted HTTPS test transport
        run: |
          mkdir -p .qa
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout .qa/localhost.key -out .qa/localhost.crt -subj "/CN=SAIMOR ephemeral CI" -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" -addext "basicConstraints=critical,CA:TRUE" > /dev/null 2>&1
          sudo cp .qa/localhost.crt /usr/local/share/ca-certificates/saimor-ci-qa.crt
          sudo update-ca-certificates
      - run: npx playwright test --config=playwright.alive.config.ts
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.qa/localhost.crt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mora-alive-website-${{ github.sha }}
          path: test-results/mora-alive
          retention-days: 7
