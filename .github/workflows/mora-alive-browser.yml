name: MORA Alive Website browser checks
on:
  pull_request:
    paths:
      - 'components/mora/alive/**'
      - 'components/MoraAliveWebsite.tsx'
      - 'app/**/mora/alive/**'
      - 'app/mora/alive/**'
      - 'e2e/mora-alive.spec.ts'
      - 'playwright.alive.config.ts'
      - '.github/workflows/mora-alive-browser.yml'
permissions:
  contents: read
concurrency:
  group: alive-website-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXTAUTH_SECRET: saimor-ephemeral-ci-only
      NEXTAUTH_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=playwright.alive.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mora-alive-website-${{ github.sha }}
          path: test-results/mora-alive
          retention-days: 7
