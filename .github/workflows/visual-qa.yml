name: Visual QA

on:
  push:
    branches: [ feat/world-one-product-truth ]
  pull_request:
    branches: [ main ]

concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-screenshots:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright for QA
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start app
        run: |
          npm start -- -p 3000 > /tmp/saimor-next.log 2>&1 &
          echo $! > /tmp/saimor-next.pid

      - name: Wait for app
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/de >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/saimor-next.log
          exit 1

      - name: Capture mobile surfaces
        run: |
          mkdir -p visual-qa
          node <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 414, height: 896 },
              deviceScaleFactor: 2,
              isMobile: true,
              hasTouch: true,
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'
            });

            for (const route of [
              ['de-home', '/de'],
              ['demo', '/demo'],
              ['mora', '/mora'],
            ]) {
              const page = await context.newPage();
              const response = await page.goto(`http://127.0.0.1:3000${route[1]}`, { waitUntil: 'networkidle' });
              if (!response || !response.ok()) throw new Error(`${route[1]} returned ${response && response.status()}`);
              await page.screenshot({ path: `visual-qa/${route[0]}-viewport.png`, fullPage: false });
              await page.screenshot({ path: `visual-qa/${route[0]}-full.png`, fullPage: true });
              const text = await page.locator('body').innerText();
              fs.writeFileSync(`visual-qa/${route[0]}.txt`, text);
              await page.close();
            }

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: world-mobile-visual-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 7
